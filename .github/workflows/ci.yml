name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NIXPKGS_ALLOW_UNFREE: '1'

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31.5.2
      - name: Generate build matrix
        id: matrix
        run: |
          matrix=$(nix eval --impure --json --expr 'import ./.github/ci-matrix.nix { root = toString ./.; }')
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.system }}, ${{ matrix.label }})
    needs: generate-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31.5.2
      - uses: cachix/cachix-action@v16
        with:
          name: siraben
          skipPush: true
      - name: Build package shard
        env:
          PACKAGES: ${{ matrix.packages }}
          SYSTEM: ${{ matrix.system }}
          BUILD_TIMEOUT: ${{ matrix.timeout }}
        run: bash .github/build-packages.sh
      - name: Cache successful outputs
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        shell: bash
        run: |
          if [[ -n "$CACHIX_AUTH_TOKEN" && -s "$RUNNER_TEMP/package-store-paths" ]]; then
            if ! sort -u "$RUNNER_TEMP/package-store-paths" | cachix push siraben; then
              echo '::warning::Could not publish successful build outputs to Cachix'
            fi
          fi

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31.5.2
      - uses: cachix/cachix-action@v16
        with:
          name: siraben
          skipPush: true
      - name: Check flake
        run: nix flake check --impure --no-build
